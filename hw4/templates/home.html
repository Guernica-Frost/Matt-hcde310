<!doctype html>
<html lang="en">
<head><title>Artwork search</title></head>
<body>
  <h1>Artwork search</h1>
  {% if message %}
    <p>{{ message }}</p>
  {% endif %}
  <form action="/results" method="get">
    <label for="author">Author</label>
    <input id="author" name="author_search">
    <button type="submit">Find artworks</button>
  </form>
</body>
</html>
